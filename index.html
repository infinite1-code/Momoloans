<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07566b">
  <title>Guess the Word</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="entry-page">
  <div class="blue-header" aria-hidden="true"></div>

  <main class="entry-card">
    <div class="phone-row">
      <div class="flag-box" aria-label="Kenyan flag">🇰🇪</div>
      <label class="phone-field">
        <span class="visually-hidden">Kenyan phone number</span>
        <span class="country-code">+254</span>
        <input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national"
               maxlength="12" placeholder="Enter number *" aria-describedby="phone-help">
      </label>
    </div>
    <p id="phone-help" class="form-help">Enter your Kenyan mobile number. Your number and word guess will be sent to the game host on Telegram.</p>
    <p id="msg" class="message" role="status" aria-live="polite"></p>
  </main>

  <button id="next" class="bottom-button" type="button" disabled>NEXT</button>
  <script>
    const phone = document.getElementById("phone");
    const next = document.getElementById("next");
    const msg = document.getElementById("msg");

    function normalizedNumber() {
      let digits = phone.value.replace(/\D/g, "");
      if (digits.startsWith("254")) digits = digits.slice(3);
      if (digits.startsWith("0")) digits = digits.slice(1);
      return digits.slice(0, 9);
    }

    phone.addEventListener("input", () => {
      const digits = normalizedNumber();
      phone.value = digits;
      next.disabled = !/^\d{9}$/.test(digits);
      msg.textContent = "";
    });

    next.addEventListener("click", () => {
      const digits = normalizedNumber();
      if (!/^\d{9}$/.test(digits)) {
        msg.textContent = "Please enter 9 digits after +254.";
        return;
      }
      sessionStorage.setItem("gamePhone", "+254" + digits);
      location.href = "guess.html";
    });

    phone.addEventListener("keydown", e => {
      if (e.key === "Enter" && !next.disabled) next.click();
    });
  </script>
</body>
</html>
